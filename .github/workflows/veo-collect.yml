name: Collect Veo snapshots

# Polls Veo's GBFS feed once a minute until 8 PM campus time and commits the
# snapshots to the veo-data branch (not main), one small file per half hour.
#
# Scheduled for Tue Oct 13, 2026 only (Mon Oct 12 was started by hand), and only
# while the repo variable VEO_WEEK_RUN is "true".
# If nothing is running by 6 AM, start it by hand: Actions > this workflow >
# Run workflow. Delete this workflow once the data is collected.

on:
  schedule:
    # 4:00, 4:30, 5:00 and 5:30 AM CDT. GitHub can start scheduled runs hours
    # late (the Oct 10 rehearsal started 5.5 hours late), so there are several
    # chances to start before 6 AM. The first one to start collects; see `concurrency`.
    - cron: "0,30 9 13 10 *"
    - cron: "0,30 10 13 10 *"
  workflow_dispatch:
    inputs:
      data_branch:
        description: Branch to commit snapshots to
        default: veo-data
      end_time:
        description: Stop time today, campus local time (HH:MM)
        default: "20:00"

# Only one run collects at a time. A run that starts while another is collecting
# waits for it; if that one finished normally it is past END_TIME and exits at
# once, and if it died early the waiting run takes over.
concurrency:
  group: veo-collect
  cancel-in-progress: false

permissions:
  contents: write

env:
  DATA_BRANCH: ${{ inputs.data_branch || 'veo-data' }}
  END_TIME: ${{ inputs.end_time || '20:00' }}

jobs:
  collect:
    if: github.event_name != 'schedule' || vars.VEO_WEEK_RUN == 'true'
    runs-on: ubuntu-latest
    # A job can run 6 hours at most, so the day is covered by three parts run
    # one after another. Parts that start after END_TIME exit right away.
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check out the data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$remote" "$DATA_BRANCH" > /dev/null; then
            git clone --quiet --depth 1 --branch "$DATA_BRANCH" "$remote" veo-data
          else
            git init --quiet -b "$DATA_BRANCH" veo-data
            git -C veo-data remote add origin "$remote"
          fi
          git -C veo-data config user.name "github-actions[bot]"
          git -C veo-data config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Collect
        run: |
          end=$(TZ=America/Chicago date -d "today ${END_TIME}" +%s)
          job_end=$(( $(date +%s) + 330 * 60 ))
          (( job_end > end )) && job_end=$end

          while (( $(date +%s) < job_end - 60 )); do
            seconds=$(( job_end - $(date +%s) ))
            (( seconds > 1800 )) && seconds=1800
            if ! python scrapers/veo_gbfs/collect.py --seconds "$seconds" --out-dir veo-data/veo_gbfs; then
              echo "::warning::collector exited with an error"
              sleep 30
            fi
            # Push after every half-hour segment so a killed job loses little.
            git -C veo-data add -A
            git -C veo-data commit --quiet -m "Veo snapshots up to $(TZ=America/Chicago date '+%F %H:%M')" || true
            git -C veo-data push --quiet origin "HEAD:${DATA_BRANCH}" || echo "::warning::push failed, will retry with the next segment"
          done
